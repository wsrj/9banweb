name: 生成提交记录

on:
  push:
    branches:
      - main

jobs:
  update-commits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 签出
        uses: actions/checkout@v4
      - name: 生成更新记录文件
        run: |
          echo "<html><body><pre>" > logs.html
          git log --oneline --all --graph >> logs.html
          echo "</pre></body></html>" >> logs.html
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs.html
          git commit -m "更新提交记录 [skip ci]"
          git push